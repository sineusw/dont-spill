<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,DPR,PY;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);PY=H*0.8;}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];

// ---------- audio ----------
let AC;
function snd(f,d,type='sine',v=.15,slide=0){if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(slide,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d);}
function noise(d,v=.3){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d|0,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g).connect(AC.destination);s.start();}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
let clinkT=0;

// ---------- lines ----------
const LINES={
 bump:["Watch it! That's a paying customer.","Did you just body-check table 6?","Smooth. Real smooth.","The kid is fine. The drinks? We'll see.","Excuse you."],

 over:["That's coming out of your paycheck.","Table 4 is NOT tipping now.","I've seen busboys with better balance.","You had one job. Several drinks, but one job.","Clean that up before the dinner rush.","I'm putting you on dish duty."]
};

// ---------- state ----------
let state='menu',best=0;try{best=+localStorage.getItem('ds_best')||0}catch(e){}
let p,objs,speed,tips,served,drinks,ang,av,spawnAt,bubble,pops,shards,t,dist,shake,dieT,maxStack,smAcc,tut,tutT,moved,combo,danger,rt,clutches,maxCombo,revived,savedDrinks,lastEarn='',goal=5,noBump=0,sh=1,rushT=0,parts=[],shiftBonus=0,lastWon=0,wonT=0,L=2600,rowN=0,fin=0,hintI=0,windT=4,windWarn=0,windGust=0,windDir=1,LT='delivery',req=0,pw={};
let tutDone=0;try{tutDone=+localStorage.getItem('ds_tut')||0}catch(e){}
const cMult=()=>Math.min(4,1+Math.floor(combo/3));
const $=id=>document.getElementById(id);
const REST=[
 {id:'diner',desc:'Kids & wet floors',name:'Diner',need:0,mult:1,spd:0,fa:'#efe2cc',fb:'#d9c4a3',b1:'#6b1f2a',b2:'#8f2c38',bg:'#c0392b'},
 {id:'steak',desc:'Sizzle carts & steam vents',name:'Steakhouse',need:120,mult:1.5,spd:30,fa:'#7a5236',fb:'#6a452c',b1:'#1f4a32',b2:'#2c6346',bg:'#6b4228'},
 {id:'roof',desc:'Wind gusts & drunk uncles',name:'Rooftop Bar',need:250,mult:2,spd:60,fa:'#2b2a44',fb:'#232238',b1:'#3d1f5c',b2:'#5a2d86',bg:'#4a2a7a',night:1},
 {id:'vegas',desc:'Jackpot pads & conga lines',name:'Vegas Buffet',need:400,mult:3,spd:90,fa:'#8e1b2c',fb:'#7a1525',b1:'#b8860b',b2:'#e0a91a',bg:'#b8860b'}];
const OUTFITS=[{id:'classic',name:'Classic',cost:0,shirt:'#fff',vest:'#1d1d26'},{id:'chef',name:'Chef Whites',cost:150,shirt:'#fff',vest:'#e8e8e8'},{id:'tux',name:'Tuxedo',cost:300,shirt:'#fff',vest:'#0b0b10',bow:1},{id:'hawaii',name:'Hawaiian',cost:500,shirt:'#ff7a3c',vest:'#2fb8a3'},{id:'gold',name:'Gold Suit',cost:1000,shirt:'#fff1b8',vest:'#d4a017'}];
const GLASSES=[{id:'classic',name:'Classic',cost:0},{id:'neon',name:'Neon',cost:200},{id:'champ',name:'Champagne',cost:400},{id:'boba',name:'Boba',cost:600}];
const SWG={classic:'linear-gradient(90deg,#c0213a,#f2a516,#5a2d12,#7ee0ff)',neon:'linear-gradient(90deg,#ff2fd0,#2fffe0,#b6ff2f)',champ:'linear-gradient(90deg,#f7e7a1,#e8c766)',boba:'linear-gradient(90deg,#c8a27a,#3b2418)'};
const GOALS=[{k:'serve',n:15,txt:'Deliver 15 drinks today'},{k:'stack',n:10,txt:'Reach a 10-drink stack'},{k:'run',n:150,txt:'Make $150 in one shift'},{k:'clutch',n:3,txt:'Get 3 clutch saves today'},{k:'stack',n:15,txt:'Carry a 15-drink stack'},{k:'serve',n:30,txt:'Deliver 30 drinks today'}];
const dstr=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),today=()=>dstr(new Date());
let S={xp:0,rank:1,shift:1,tab:{tables:1,waiter:0,host:0,bartender:0,busboy:0},decor:[],last:Date.now(),coins:0,best:{},own:['classic','g_classic'],outfit:'classic',glass:'classic',rest:0,day:'',goals:[],streak:0,lastDay:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('ds_save')||'{}'))}catch(e){}
if(!S.best.diner&&best)S.best.diner=best;
const UPS=[{k:'tables',name:'Tables',max:8,base:50,g:1.45,eff:l=>'$'+(l*2)+'/min idle'},{k:'waiter',name:'Waiters',max:5,base:120,g:1.8,eff:l=>'$'+(l*6)+'/min idle'},{k:'host',name:'Host',max:5,base:150,g:1.9,eff:l=>'+'+(l*10)+'% tips'},{k:'bartender',name:'Bartender',max:5,base:200,g:1.9,eff:l=>'steadier stack Lv'+l},{k:'busboy',name:'Busboy',max:5,base:180,g:1.9,eff:l=>'-'+(l*18)+'% wet floors'}];
const DECOR=[{k:'plants',name:'Plants',cost:80},{k:'lights',name:'String Lights',cost:150},{k:'neon',name:'Neon Sign',cost:300},{k:'jukebox',name:'Jukebox',cost:500},{k:'fountain',name:'Fountain',cost:900}];
const boost=()=>1+.1*S.tab.host+.05*S.decor.length+(has('cash')?.25:0),rateMin=()=>S.tab.tables*2+S.tab.waiter*6+(window.roomRate?window.roomRate():0);
const pending=()=>Math.floor(Math.min(rateMin()*480,(Date.now()-S.last)/60000*rateMin()));
const upCost=u=>Math.round(u.base*Math.pow(u.g,S.tab[u.k]-(u.k==='tables'?1:0)));
function renderBuild(){$('wallet3').textContent='$'+S.coins;$('collect').textContent='COLLECT $'+pending();$('rate').textContent='Earning $'+rateMin()+'/min while you\'re away (holds up to 8 hrs) · Tips boost +'+Math.round((boost()-1)*100)+'%';
 $('ups').innerHTML=(bTab==='decor'?'':UPS.map(u=>{const l=S.tab[u.k],mx=l>=u.max,c=upCost(u);return `<div class="card bk"><div style="flex:1"><b>${u.name}</b> <small>Lv ${l}/${u.max}</small><div style="font-size:12px;opacity:.85">${u.eff(l)}${mx?'':' → '+u.eff(l+1)}</div></div><button data-u="${u.k}" style="font-size:16px;padding:10px 14px;margin:0;${!mx&&S.coins<c?'opacity:.5':''}">${mx?'MAX':'$'+c}</button></div>`}).join(''))
 +(bTab!=='decor'?'':DECOR.map(d=>{const own=S.decor.includes(d.k);return `<div class="card bk"><div style="flex:1"><b>${d.name}</b><div style="font-size:12px;opacity:.85">Decor · +5% tips</div></div><button data-d="${d.k}" style="font-size:16px;padding:10px 14px;margin:0;${!own&&S.coins<d.cost?'opacity:.5':''}">${own?'OWNED':'$'+d.cost}</button></div>`}).join(''));
 $('tStaff').className=bTab==='decor'?'ghost':'';$('tDecor').className=bTab==='decor'?'':'ghost';}
let bTab='staff';
function buildClick(e){const b=e.target.closest('button');if(!b)return;
 if(b.dataset.u){const u=UPS.find(x=>x.k===b.dataset.u);if(S.tab[u.k]>=u.max)return;const c=upCost(u);if(S.coins<c)return;S.coins-=c;S.tab[u.k]++;}
 else if(b.dataset.d){const d=DECOR.find(x=>x.k===b.dataset.d);if(S.decor.includes(d.k)||S.coins<d.cost)return;S.coins-=d.cost;S.decor.push(d.k);}
 snd(880,.1,'triangle',.15);setTimeout(()=>snd(1320,.15,'triangle',.12),70);save();renderBuild();}
function mini(x,y,shirt,vest,skin,tool){cx.fillStyle='rgba(0,0,0,.2)';cx.beginPath();cx.ellipse(x,y+13,11,4,0,0,7);cx.fill();cx.fillStyle=shirt;rr(x-9,y-6,18,18,7);cx.fill();cx.strokeStyle='#2a1a2e';cx.lineWidth=2;cx.stroke();
 if(vest){cx.fillStyle=vest;cx.fillRect(x-9,y-3,5,14);cx.fillRect(x+4,y-3,5,14);}cx.fillStyle=skin;cx.beginPath();cx.arc(x,y-12,8,0,7);cx.fill();cx.stroke();
 if(tool==='tray'){cx.fillStyle='#d6dde4';cx.beginPath();cx.ellipse(x+12,y-16,9,3,0,0,7);cx.fill();cx.fillStyle='#f2a516';cx.fillRect(x+9,y-26,6,9);}
 if(tool==='mop'){cx.strokeStyle='#8a6a3a';cx.lineWidth=3;cx.beginPath();cx.moveTo(x+10,y-14);cx.lineTo(x+16,y+12);cx.stroke();}}
function buildScene(){const T=S.tab,h=H*.46;cx.fillStyle='#1a1220';cx.fillRect(0,0,W,H);
 cx.fillStyle='#ffcf9e';cx.fillRect(0,0,W,62);cx.fillStyle='#e8a873';cx.fillRect(0,56,W,8);
 for(let y=64,r=0;y<h;y+=40,r++)for(let x=0,c=0;x<W;x+=40,c++){cx.fillStyle=(r+c)&1?'#f7e6cc':'#ecd3ad';cx.fillRect(x,y,40,40);}
 const lg=cx.createLinearGradient(0,64,0,h);lg.addColorStop(0,'rgba(0,0,0,.14)');lg.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=lg;cx.fillRect(0,64,W,h-64);
 cx.fillStyle='#7a2a32';cx.font='900 18px system-ui';cx.textAlign='left';cx.fillText('YOUR DINER',14,26);cx.font='700 12px system-ui';cx.fillText('$'+rateMin()+'/min',14,44);
 if(S.decor.includes('lights'))for(let x=10;x<W;x+=24){cx.fillStyle=['#ffd23f','#ff4fa3','#2fd3ff','#7cff6b'][(x/24|0)%4];cx.globalAlpha=.6+.4*Math.sin(t*4+x);cx.beginPath();cx.arc(x,8+Math.sin(x*.3)*3,4,0,7);cx.fill();}cx.globalAlpha=1;
 if(S.decor.includes('neon')){cx.save();cx.shadowColor='#ff4fa3';cx.shadowBlur=14;cx.fillStyle='#ff9fd0';cx.font='900 22px system-ui';cx.textAlign='center';cx.fillText('OPEN',W/2,38);cx.restore();}
 const pd=pending();if(pd>0){const bx=W-70,by=30+Math.sin(t*4)*3;cx.fillStyle='#2bb673';rr(bx-40,by-16,96,30,15);cx.fill();cx.strokeStyle='#14532d';cx.lineWidth=2.5;cx.stroke();cx.fillStyle='#fff';cx.font='900 15px system-ui';cx.textAlign='center';cx.fillText('$'+pd+' 💵',bx+8,by+5);}
 // bar
 cx.fillStyle='#5b3a24';rr(14,74,120,30,8);cx.fill();cx.strokeStyle='#2a1a2e';cx.lineWidth=2.5;cx.stroke();cx.fillStyle='#8a5a38';rr(14,74,120,8,6);cx.fill();

 pos.forEach(([x,y],i)=>{if(i<T.tables){cx.fillStyle='rgba(0,0,0,.18)';cx.beginPath();cx.ellipse(x+3,y+8,26,14,0,0,7);cx.fill();
   for(const a of [-1,1]){cx.fillStyle='#5b3a24';cx.beginPath();cx.arc(x+a*26,y,8,0,7);cx.fill();cx.strokeStyle='#2a1a2e';cx.lineWidth=2;cx.stroke();cx.fillStyle=['#8d5524','#f1c27d','#c68642'][(i+a+3)%3];cx.beginPath();cx.arc(x+a*26,y-8,7,0,7);cx.fill();cx.stroke();}
   cx.fillStyle='#bfae9e';cx.beginPath();cx.arc(x,y+4,18,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(x,y,18,0,7);cx.fill();cx.strokeStyle='#2a1a2e';cx.lineWidth=2.5;cx.stroke();cx.fillStyle='#d94a2b';cx.beginPath();cx.arc(x,y,4,0,7);cx.fill();}
  else if(i===T.tables){cx.setLineDash([6,5]);cx.strokeStyle='rgba(122,42,50,.6)';cx.lineWidth=2.5;cx.beginPath();cx.arc(x,y,18,0,7);cx.stroke();cx.setLineDash([]);cx.fillStyle='rgba(122,42,50,.7)';cx.font='900 20px system-ui';cx.textAlign='center';cx.fillText('+',x,y+7);}});
 // waiters walk between tables
 for(let w=0;w<T.waiter;w++){const n=Math.max(1,T.tables),u=(t*.25+w*.37)%1*n,a=pos[Math.floor(u)%n],b=pos[(Math.floor(u)+1)%n],f=u%1;mini(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f-26,'#fff','#1d1d26',['#8d5524','#f1c27d','#5c3a1e'][w%3],'tray');}

 if(state==='play'||state==='won'){const bw=Math.min(300,W-120),bx=W/2-bw/2,by=H-40,f=Math.min(1,dist/L);cx.fillStyle='rgba(255,255,255,.92)';rr(bx-10,by-26,bw+20,44,12);cx.fill();cx.fillStyle='#1a1220';cx.font='800 12px system-ui';cx.textAlign='left';cx.fillText('SHIFT '+sh+({delivery:'',gauntlet:' · GAUNTLET',bonus:' · BONUS: TIP RAIN',boss:' · BOSS: CRITIC NEEDS '+req})[LT]+(sh%5===0?' · BIG ORDER':''),bx,by-10);cx.textAlign='right';cx.fillText((fin?'VIP ROW!':Math.round(Math.min(1,dist/L)*100)+'%'),bx+bw,by-10);cx.fillStyle='#e8dcd0';rr(bx,by-2,bw,10,5);cx.fill();cx.fillStyle=rushT>0?'#ff4fa3':'#2bb673';rr(bx,by-2,Math.max(10,bw*f),10,5);cx.fill();}
 if(rushT>0&&state==='play'){cx.strokeStyle=`rgba(255,79,163,${.5+.5*Math.sin(t*14)})`;cx.lineWidth=8;cx.strokeRect(4,4,W-8,H-8);cx.fillStyle='#ff4fa3';cx.font='900 18px system-ui';cx.textAlign='center';cx.fillText('RUSH ROUND x2 · '+Math.ceil(rushT),W/2,H-80);}
 {const ks=Object.keys(pw).filter(k=>pw[k]>0);ks.forEach((k,i)=>{const P=PW[k],x=W/2+(i-(ks.length-1)/2)*96,y=H-92;cx.fillStyle=P.c;rr(x-44,y-14,88,26,13);cx.fill();cx.fillStyle='#1a1220';cx.font='900 12px system-ui';cx.textAlign='center';cx.fillText(P.ic+' '+Math.ceil(pw[k])+'s',x,y+4);});}
 if(state==='play'&&(windWarn>0||windGust>0)){cx.fillStyle=windGust>0?'rgba(47,211,255,.92)':'rgba(255,255,255,.92)';rr(W/2-110,H*.3,220,36,18);cx.fill();cx.fillStyle='#1a1220';cx.font='900 17px system-ui';cx.textAlign='center';cx.fillText(windGust>0?'GUST '+(windDir>0?'→→→':'←←←'):'WIND '+(windDir>0?'→':'←')+' INCOMING',W/2,H*.3+24);
  if(windGust>0){cx.strokeStyle='rgba(255,255,255,.55)';cx.lineWidth=2;for(let i=0;i<12;i++){const yy=(i*67+t*40)%H,xx=((t*700*windDir+i*137)%W+W)%W;cx.beginPath();cx.moveTo(xx,yy);cx.lineTo(xx-windDir*60,yy);cx.stroke();}}}
 // lean arrow
 if(state==='play'&&Math.abs(ang)>.2){const d=Math.sign(ang),ax=p.x+d*70,ay=PY-70,a2=.6+.4*Math.sin(t*16);cx.globalAlpha=a2;cx.fillStyle='#ff5a3c';cx.beginPath();cx.moveTo(ax+d*26,ay);cx.lineTo(ax-d*4,ay-20);cx.lineTo(ax-d*4,ay-8);cx.lineTo(ax-d*26,ay-8);cx.lineTo(ax-d*26,ay+8);cx.lineTo(ax-d*4,ay+8);cx.lineTo(ax-d*4,ay+20);cx.closePath();cx.fill();cx.fillStyle='#1a1220';cx.font='900 12px system-ui';cx.textAlign='center';cx.fillText('MOVE',ax,ay+38);cx.globalAlpha=1;}
 // tutorial
 if(state==='play'&&tut<3){const L=[['DRAG left and right to move'],['Walk next to the','glowing table to serve it'],['Each serve adds a drink.','When it leans, MOVE TOWARD THE LEAN']][tut];
  const bw=Math.min(W-40,320),bx=W/2-bw/2,by=H*.38;cx.fillStyle='rgba(26,18,32,.88)';rr(bx,by,bw,26+L.length*24,16);cx.fill();cx.fillStyle='#ffd23f';cx.font='800 17px system-ui';cx.textAlign='center';L.forEach((l,i)=>cx.fillText(l,W/2,by+30+i*24));
  if(tut===0){const hx=W/2+Math.sin(t*3)*70,hy=PY+5;cx.fillStyle='rgba(255,255,255,.85)';cx.beginPath();cx.arc(hx,hy,16,0,7);cx.fill();cx.strokeStyle='#1a1220';cx.lineWidth=3;cx.stroke();}}
 // manager bubble
 if(bubble){
  cx.globalAlpha=Math.min(1,bubble.life*3);cx.font='700 15px system-ui';
  const tw=Math.min(W-40,cx.measureText(bubble.t).width+28),bx=W/2-tw/2,by=top+60;
  cx.fillStyle='#fff';rr(bx,by,tw,44,14);cx.fill();cx.strokeStyle='#1a1220';cx.lineWidth=2.5;cx.stroke();
  cx.fillStyle='#b3361f';cx.font='900 10px system-ui';cx.textAlign='left';cx.fillText('MANAGER',bx+14,by+15);
  cx.fillStyle='#1a1220';cx.font='700 15px system-ui';cx.fillText(bubble.t,bx+14,by+34,tw-24);
  cx.globalAlpha=1;
 }
 for(const q of pops){cx.globalAlpha=q.life;cx.fillStyle='#2bb673';cx.font='900 24px system-ui';cx.textAlign='center';cx.fillText(q.t,q.x,q.y);}cx.globalAlpha=1;
 // danger vignette
 const d=clamp((Math.abs(ang)-.45)/.4,0,1);if(d>0&&state==='play'){cx.fillStyle=`rgba(255,40,30,${d*.25*(.7+.3*Math.sin(t*20))})`;cx.fillRect(0,0,W,H);}
}
function draw(){if(state==='build')return buildScene();
 cx.save();if(shake)cx.translate(rand(-shake,shake),rand(-shake,shake));
 floor();
 if(p){
  for(const o of objs){if(o.type==='puddle')puddle(o);}
  for(const o of objs){if(o.type==='table')table(o,false);else if(o.type==='serve')table(o,true);else if(o.type==='kid')kid(o);else if(o.type==='uncle')uncle(o);else if(o.type==='pickup')pickup(o);else if(o.type==='mtable')mtable(o);else if(o.type==='coin')coin(o);else if(o.type==='guest')guest(o);else if(o.type==='cart')cart(o);else if(o.type==='power')power(o);}
  server();
  if(state==='play'){if(pw.shield>0){cx.strokeStyle='rgba(255,210,63,'+(.5+.4*Math.sin(t*10))+')';cx.lineWidth=5;cx.beginPath();cx.ellipse(p.x,PY-30,46,70,0,0,7);cx.stroke();}if(pw.magnet>0){const r=(t*120)%80;cx.strokeStyle='rgba(255,79,163,'+(1-r/80)+')';cx.lineWidth=3;cx.beginPath();cx.arc(p.x,PY-10,30+r,0,7);cx.stroke();}if(pw.slow>0){cx.fillStyle='rgba(47,211,255,.08)';cx.fillRect(0,0,W,H);}}
  for(const q of parts){cx.globalAlpha=Math.max(0,q.life);cx.fillStyle=q.c;cx.fillRect(q.x-3,q.y-3,6,6);}cx.globalAlpha=1;
  for(const s of shards){cx.save();cx.translate(s.x,s.y);cx.rotate(s.rot);glass(0,16);cx.fillStyle=s.c;cx.globalAlpha=.6;cx.beginPath();cx.ellipse(0,0,8,4,0,0,7);cx.fill();cx.restore();}
  hud();
 }
 cx.restore();
}

// ---------- loop ----------
let last=performance.now();
function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 if(state==='shift'){if(window.buildScene){cx.setTransform(DPR,0,0,DPR,0,0);buildScene(true);}requestAnimationFrame(loop);return;}
 if(state==='build')t+=dt;
 if(state==='play')update(dt);
 else if(state==='won'){wonT+=dt;t+=dt;updParts(dt);for(const q of pops){q.life-=dt;q.y-=50*dt;}pops=pops.filter(q=>q.life>0);if(bubble)bubble.life-=dt;if(wonT>1.6){state='over';finalize();showOver();}}
 else if(state==='dying'){dieT+=dt;updParts(dt);t+=dt;shake=Math.max(0,shake-dt*20);
  for(const s of shards){s.vy+=900*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=s.r*dt;if(s.y>PY+30){s.y=PY+30;s.vy*=-.25;s.vx*=.6;s.r*=.5;}}
  if(bubble){bubble.life-=dt;}
  if(dieT>1.3){if(!revived&&tips>0){state='revive';$('revive').classList.remove('hidden');}else{state='over';finalize();showOver();}}}
 if(!p){reset();}
 draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function start(){
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();}catch(e){}
 best=S.best[REST[S.rest].id]||0;reset();state='play';$('shop').classList.add('hidden');document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');
 say(LT==='boss'?'The food critic is here. Bring at least '+req+' drinks.':LT==='bonus'?'Bonus shift! Grab every tip. No obstacles.':LT==='gauntlet'?'Gauntlet. Packed house. Bigger pads.':sh%5===0?"Big order. Eight drinks. Don't.":'Shift '+sh+'. Get this order to the VIP row.',true);
}

 document.getElementById('tips').textContent='$'+tips;
 document.getElementById('stats').textContent=`${served} drinks delivered · tallest stack ${maxStack} · best $${best}`;
 document.getElementById('line').textContent='"'+(lastWon?pick(["Shift done. Don't get comfortable.",'You can come back tomorrow.','Acceptable. Barely.']):pick(LINES.over))+'" — Manager';
 $('oLbl').textContent=lastWon?'SHIFT '+(S.shift-1)+' COMPLETE!':'SHIFT FAILED';$('again').textContent=lastWon?'NEXT SHIFT':'RETRY SHIFT';$('earned').innerHTML=lastEarn;if(rankUp){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>snd(f,.25,'triangle',.15),i*120));rankUp=0;}$('over').classList.remove('hidden');
}

$('revYes').onclick=()=>{$('revYes').classList.add('hidden');$('revNo').classList.add('hidden');const ab=$('adbox');ab.classList.remove('hidden');let n=3;const show=()=>ab.innerHTML='AD · '+n+'<div style="font-size:12px;font-weight:600;opacity:.7">Placeholder: real ads come with the app build</div>';show();
 const iv=setInterval(()=>{n--;if(n>0)return show();clearInterval(iv);ab.classList.add('hidden');$('revYes').classList.remove('hidden');$('revNo').classList.remove('hidden');$('revive').classList.add('hidden');
  revived=1;drinks=Math.max(3,savedDrinks);ang=0;av=0;danger=0;shards=[];objs=objs.filter(o=>o.y<PY-220||o.y>PY+80);state='play';say("Fine. One more chance. Don't make me regret it.",true);},1000);};
